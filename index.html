<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生物基礎 暗記プリント完全道場</title>
    <link rel="stylesheet" href="css/style.css?v=20261126-4">
</head>
<body>

<div id="home-screen" class="screen active">
    <header class="home-top-bar">
        <div class="category-switcher" role="tablist" aria-label="学習モード選択">
            <button type="button" id="tab-sheet" class="category-tab active" role="tab" aria-selected="true" data-category="sheet">
                <span>🔴 デジタル赤シート ＆ 穴埋め</span>
                <span class="tab-score" id="tab-score-sheet" hidden></span>
            </button>
            <button type="button" id="tab-pair" class="category-tab" role="tab" aria-selected="false" data-category="pair">
                <span>⚖️ 対（ペア）で覚える！</span>
                <span class="tab-score" id="tab-score-pair" hidden></span>
            </button>
        </div>
        <button type="button" class="mute-btn" id="home-mute-btn" aria-label="効果音のオン・オフ">🔊 音ON</button>
    </header>

    <main class="home-body">
        <section class="home-info">
            <h1>生物基礎 暗記プリント完全道場 📱</h1>
            <div class="earned-title-banner" id="earned-title-banner" hidden></div>
            <p class="desc" id="home-desc">プリントの重要文を赤シートで隠して確認！</p>

            <div style="margin-bottom: 14px;">
                <label for="scope-select" style="font-weight:bold; margin-right:8px;">プリント範囲：</label>
                <select id="scope-select" class="scope-select">
                    <option value="all">📚 全範囲ミックス（No.1〜4）</option>
                    <option value="1">🧬 No.1 細胞・酵素・DNA</option>
                    <option value="2">🧠 No.2 神経とホルモン</option>
                    <option value="3">🛡️ No.3 免疫</option>
                    <option value="4">🌿 No.4 植生と生態系</option>
                </select>
            </div>

            <ul class="rules" id="home-rules">
                <li class="rule-item"><span class="rule-icon">🔰</span><div><b>かんたん</b>：赤シートめくり／ヒントつき</div></li>
                <li class="rule-item"><span class="rule-icon">🧪</span><div><b>ふつう</b>：空欄に用語カードを当てはめてテスト</div></li>
                <li class="rule-item" id="rule-oni-item" hidden><span class="rule-icon">👹</span><div><b>おに</b>：60秒TA（ミス-5秒／5連続正解で+3秒）</div></li>
            </ul>
        </section>

        <section class="home-actions" aria-label="難易度を選んでスタート">
            <div class="mode-buttons">
                <button type="button" class="mode-btn btn-easy" data-difficulty="easy">🔰 かんたんでスタート</button>
                <button type="button" class="mode-btn btn-normal" data-difficulty="normal">🧪 ふつうでスタート</button>
                <button type="button" class="mode-btn btn-oni" id="btn-oni" data-difficulty="oni" hidden>👹 おにでスタート</button>
            </div>
            <p class="kbd-help">
                <span class="kbd-line">⌨️ <kbd>Tab</kbd> 移動　<kbd>Enter</kbd> 決定　<kbd>Esc</kbd> 選択解除</span>
                <span class="kbd-line">👹 おには <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> キーでそのまま回答</span>
            </p>
        </section>
    </main>
</div>

<div id="game-screen" class="screen">
    <header class="header">
        <button type="button" class="reset-btn" id="home-btn"><span class="reset-icon">🏠</span> ホーム</button>
        <div class="progress-container" id="progress-container">
            <div class="timer-badge" id="timer-badge" hidden>⏱️ <span id="timer-text">60</span>秒</div>
            <div class="combo-badge" id="combo-badge" hidden>🔥 2 COMBO</div>
            <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-fill"></div></div>
            <div class="score-text" id="score-text">0問</div>
        </div>
        <div class="header-right">
            <div class="mode-display" id="mode-display">📚 全範囲 / 🔰 かんたん</div>
            <button type="button" class="mute-btn" id="game-mute-btn" aria-label="効果音のオン・オフ">🔊</button>
        </div>
    </header>

    <main class="main">
        <section class="graph-container" id="board-area"></section>
        <aside class="tray">
            <div class="tray-title">
                <span id="tray-title-text">📝 用語カード</span>
                <span class="tray-hint" id="tray-hint">👆クリックで選択</span>
            </div>
            <div class="card-list" id="card-list" role="list" aria-label="カード一覧"></div>
        </aside>
    </main>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<div id="clear-overlay">
    <div class="clear-message-box">
        <h1 class="clear-title" id="clear-title">🎊 素晴らしい！ 🎊</h1>
        <div class="clear-subtitle" id="clear-subtitle">すべてマスターしました！</div>
        <div class="clear-actions" id="clear-actions" hidden>
            <button type="button" class="action-btn action-retry" id="retry-btn">🔄 もう一回</button>
            <button type="button" class="action-btn action-home" id="overlay-home-btn">🏠 ホームに戻る</button>
        </div>
        <div class="auto-return-text" id="auto-return-text">まもなくホーム画面に戻ります...</div>
    </div>
</div>

<script type="module" src="js/app.js?v=20261126-4"></script>
</body>
</html>
